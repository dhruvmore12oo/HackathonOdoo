version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: traveloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traveloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traveloop_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-traveloop_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traveloop_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traveloop_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traveloop_backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-traveloop_user}:${POSTGRES_PASSWORD:-traveloop_secret_change_me}@postgres:5432/${POSTGRES_DB:-traveloop_db}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traveloop_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traveloop_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - traveloop_net

  nginx:
    image: nginx:alpine
    container_name: traveloop_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - traveloop_net

volumes:
  postgres_data:
  backend_uploads:

networks:
  traveloop_net:
    driver: bridge
