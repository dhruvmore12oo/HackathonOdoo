name: Traveloop CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: TypeCheck
        working-directory: ${{ matrix.workspace }}
        run: npx tsc --noEmit

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t traveloop-backend:ci ./backend

      - name: Build Frontend Image
        run: docker build -t traveloop-frontend:ci ./frontend

      - name: Verify Images
        run: |
          docker images | grep traveloop
